name: debug-linux-skipstone
on:
  push:
    branches: [ debug/linux-skipstone ]
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> $GITHUB_ENV
      - uses: skiptools/actions/setup-skip@v1
        with:
          verify-project: '.'
          install-swift-android-sdk: true
      - name: Build, then re-run the failing skipstone command
        run: |
          set +e; mkdir -p dbg
          ulimit -a | tee dbg/ulimit.txt
          skip android build --verbose > dbg/build.log 2>&1; echo "build exit=$?" | tee dbg/exit.txt
          tail -50 dbg/build.log
          CMD=$(grep -m1 -oE '/[^ ]*/skip skipstone --project [^ ]*/Sources/SkipUI .*' dbg/build.log || true)
          echo "CMD=$CMD" | cut -c1-300
          if [ -n "$CMD" ]; then
            bash -c "$CMD" > dbg/skipstone.out 2> dbg/skipstone.err; echo "skipstone exit=$?" | tee -a dbg/exit.txt
            tail -100 dbg/skipstone.out; echo ---stderr---; tail -100 dbg/skipstone.err
            BIN=${CMD%% skipstone *}
            HASH=$(echo "$CMD" | grep -oE -- '--sourcehash [^ ]+' | cut -d' ' -f2)
            echo "HASH=$HASH"
            for SIZE in default 524288 1048576 8388608; do
              rm -f "$HASH"
              if [ "$SIZE" = default ]; then B="$BIN"; else cp "$BIN" /tmp/skip-$SIZE && python3 .github/scripts/set-gnu-stack.py /tmp/skip-$SIZE $SIZE; B=/tmp/skip-$SIZE; fi
              bash -c "$B skipstone ${CMD#* skipstone }" > dbg/skipstone-$SIZE.out 2>&1; echo "skipstone stack=$SIZE exit=$?" | tee -a dbg/exit.txt
              tail -3 dbg/skipstone-$SIZE.out | cut -c1-300
              ls -la "$HASH" 2>&1 | tee -a dbg/exit.txt
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbg
          path: dbg/
