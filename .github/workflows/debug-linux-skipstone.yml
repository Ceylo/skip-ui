name: debug-linux-skipstone
on:
  push:
    branches: [ debug/linux-skipstone ]
jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - run: echo "JAVA_HOME=${JAVA_HOME_21_X64}" >> $GITHUB_ENV
      - uses: skiptools/actions/setup-skip@v1
        with:
          verify-project: '.'
          install-swift-android-sdk: true
      - name: Build, then re-run the failing skipstone command
        run: |
          set +e; mkdir -p dbg
          ulimit -a | tee dbg/ulimit.txt
          skip android build --verbose > dbg/build.log 2>&1; echo "build exit=$?" | tee dbg/exit.txt
          tail -50 dbg/build.log
          CMD=$(grep -m1 -oE '/[^ ]*/skip skipstone --project [^ ]*/Sources/SkipUI .*' dbg/build.log || true)
          echo "CMD=$CMD" | cut -c1-300
          if [ -n "$CMD" ]; then
            bash -c "$CMD" > dbg/skipstone.out 2> dbg/skipstone.err; echo "skipstone exit=$?" | tee -a dbg/exit.txt
            tail -100 dbg/skipstone.out; echo ---stderr---; tail -100 dbg/skipstone.err
            (ulimit -s unlimited; bash -c "$CMD" > dbg/skipstone-ulimit.out 2>&1; echo "skipstone ulimit-s-unlimited exit=$?" | tee -a dbg/exit.txt)
            sudo apt-get install -y gdb > /dev/null 2>&1 || true
            BIN=${CMD%% skipstone *}
            ARGS=${CMD#* skipstone }
            echo "BIN=$BIN"
            gdb -batch -ex "run skipstone $ARGS" -ex "bt 60" -ex "info threads" -ex "thread apply all bt 8" --args "$BIN" > dbg/gdb.txt 2>&1
            grep -nE "SIGSEGV|^#|Thread|stack" dbg/gdb.txt | head -120
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbg
          path: dbg/
